# Offline Expanded search space for the PPU NN/NT GEMM kernel.  The
# production Pareto list remains in ops/mm.py and is used in Default mode.
#
# The Cartesian product is intentionally bounded.  The PPU-specific config
# builder removes configurations that exceed the conservative shared-memory
# budget or require more than 128 FP32 accumulator registers per thread.
mm_ppu:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_m:
      - 32
      - 64
      # Larger row tiles remain available through the production Pareto
      # candidates merged into the expanded pool.  Keeping the Cartesian
      # exploration focused avoids thousands of redundant compiler jobs.
    block_n:
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
    block_k:
      - 32
      - 64
      - 128
      # A single partial BM32 row tile with deep K benefits from a larger
      # reduction tile; the runtime pruner admits this only in that
      # low-wave bucket.
      - 256
    group_m:
      - 1
      # GROUP_M variants from the production shortlist are appended below;
      # expanded search only needs one representative grouping.
    load_mode:
      # Both operands use TLE/AIU asynchronous loads. NT uses the PPU
      # column-major order=(0,1) descriptor for logical B.
      - 0
      # A uses a boundary-checked TLE/AIU descriptor while B stays on the
      # regular pointer path.  This is important for partial-row wide GEMMs.
      - 1
      # Both operands use regular Triton loads.
      - 3
    stages:
      - 2
      - 3
      - 4
    warps:
      - 4
      - 8
  - strategy:
      FUSE_ADDMM: default
      B_TRANSPOSED: default
      aiu_load_mask: default
      M: default
      N: default
      K: default

# Expanded search for skinny GEMMs.  The kernel fixes its physical M dot tile
# at 16, so only N/K/load/pipeline dimensions are tunable.
mm_ppu_small_m:
  - config:
    param_map:
      META:
        BLOCK_N: block_n
        BLOCK_K: block_k
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_n:
      - 64
      - 128
      - 256
      - 512
      - 1024
    block_k:
      - 32
      - 64
    load_mode:
      - 0
      - 1
      - 2
      - 3
    stages:
      - 2
      - 3
      - 4
      - 5
    warps:
      - 4
      - 8
  - strategy:
      FUSE_ADDMM: default
      B_TRANSPOSED: default
      aiu_load_mask: default
      M: default
      N: default
      K: default

# Narrow N needs more output programs and the measured five-stage PPU
# pipeline.  Keep this space separate so wide GEMMs do not pay for it.
mm_ppu_narrow_n:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    # Tall row tiles amortize column GEMM reductions once M spans multiple
    # physical waves; pruning keeps these legal for smaller extents.
    block_m: [16, 32, 64, 128, 256, 512]
    block_n: [16, 32, 64]
    block_k: [32, 64, 128]
    load_mode: [0, 1, 3]
    stages: [2, 3, 4, 5]
    warps: [4, 8]
  - strategy:
      FUSE_ADDMM: default
      B_TRANSPOSED: default
      aiu_load_mask: default
      M: default
      N: default
      K: default

# Expanded search for 16 < M < 32.  BLOCK_M stays at the single legal 32-row
# tile so AABS and ConfigCache keep an identical schema.
mm_ppu_mid_m:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_m:
      - 32
    block_n:
      - 64
      - 128
      - 256
      - 512
    block_k:
      - 32
      - 64
    load_mode:
      - 0
      - 1
      - 2
      - 3
    stages:
      - 2
      - 3
      - 4
      - 5
    warps:
      - 4
      - 8
  - strategy:
      FUSE_ADDMM: default
      B_TRANSPOSED: default
      GROUPED_ROWS: default
      aiu_load_mask: default
      M: default
      N: default
      K: default

gemv_ppu:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_K: block_k
      num_stages: stages
      num_warps: warps
    block_m: [1, 2, 4, 8, 16, 32, 64]
    block_k:
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
    stages:
      - 2
      - 3
    warps:
      # Single-warp candidates are required for launch-bound singleton-column
      # GEMV.  The resulting space is 7*7*3*2 = 294 candidates before pruning.
      - 1
      - 4
      - 8
  - strategy:
      FUSE_ADDMM: default
      TRANSPOSED: default
      B_TRANSPOSED: default
      M: default
      K: default

mm_ppu_multi_row_gemv:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_K: block_k
      num_stages: stages
      num_warps: warps
    block_m: [1, 2, 4, 8, 16]
    block_k: [128, 256, 512, 1024, 2048]
    stages: [2, 3]
    warps: [4, 8]
  - strategy:
      FUSE_ADDMM: default
      B_TRANSPOSED: default
      M: default
      N: default
      K: default

mm_ppu_grouped_row_gemv:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_K: block_k
        ROWS_PER_PROGRAM: rows_per_program
      num_stages: stages
      num_warps: warps
    block_m: [16, 32]
    block_k: [32, 64, 128]
    rows_per_program: [16]
    stages: [2, 3, 4]
    warps: [4, 8]
  - strategy:
      FUSE_ADDMM: default
      B_TRANSPOSED: default
      M: default
      N: default
      K: default

# Expanded split-K spaces retain the measured candidates and add nearby legal
# tiles.  Each generated config list stays below 5,000 after legality
# filtering; runtime pruning removes shape-incompatible contiguous slices.
mm_ppu_split_k:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        SPLIT_K: split_k
        LOAD_MODE: load_mode
        INTERLEAVED: interleaved
      num_stages: stages
      num_warps: warps
    block_m: [16, 32, 64, 128]
    block_n: [64, 128, 256]
    block_k: [32, 64, 128]
    split_k: [2, 4, 6, 7, 8]
    load_mode: [0, 2, 3]
    interleaved: [false, true]
    stages: [4, 5]
    warps: [4, 8]
  - strategy:
      B_TRANSPOSED: default
      aiu_load_mask: default
      M: default
      N: default
      K: default

mm_ppu_split_k_reduce:
  - config:
    param_map:
      META:
        BLOCK: block
        VEC: vec
      num_stages: stages
      num_warps: warps
    block: [128, 256]
    vec: [4, 8]
    stages: [1]
    warps: [4, 8]
  - strategy:
      n_elements: default
      SPLIT_K: default
